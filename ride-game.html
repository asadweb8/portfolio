<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#c7e7de" />
    <title>Open Road | A Canvas Ride</title>
    <style>
      :root {
        color-scheme: light;
        --ink: #1d302b;
        --paper: #f9f8ee;
        --grass: #cbe27a;
        --coral: #df684b;
        --line: rgba(29, 48, 43, .2);
        --mono: 'Courier New', monospace;
        --sans: 'Trebuchet MS', 'Segoe UI', sans-serif;
      }

      * { box-sizing: border-box; }

      html, body { width: 100%; height: 100%; margin: 0; overflow: hidden; }

      body {
        min-width: 320px;
        background: #c7e7de;
        color: var(--ink);
        font-family: var(--sans);
      }

      button { color: inherit; font: inherit; }
      button:focus-visible { outline: 3px solid var(--coral); outline-offset: 4px; }

      .game {
        position: relative;
        width: 100%;
        height: 100%;
        min-height: 440px;
        isolation: isolate;
        overflow: hidden;
      }

      #ride-canvas { position: absolute; inset: 0; width: 100%; height: 100%; }

      .masthead {
        position: absolute;
        z-index: 2;
        top: 0;
        right: 0;
        left: 0;
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding: max(25px, env(safe-area-inset-top)) clamp(20px, 5vw, 72px) 0;
        pointer-events: none;
      }

      .brand { display: flex; align-items: center; gap: 11px; }
      .brand-mark {
        display: grid;
        width: 36px;
        height: 36px;
        place-items: center;
        border: 1px solid rgba(29, 48, 43, .4);
        border-radius: 50%;
        font-family: Georgia, serif;
        font-size: 21px;
        font-style: italic;
      }
      .brand-name { display: grid; gap: 3px; }
      .brand-name strong { font-size: 11px; letter-spacing: .14em; }
      .brand-name small { color: rgba(29, 48, 43, .65); font-family: var(--mono); font-size: 8px; letter-spacing: .1em; }

      .ride-stats { display: flex; align-items: center; gap: clamp(14px, 3vw, 36px); }
      .stat { display: grid; min-width: 61px; gap: 4px; }
      .stat-label { color: rgba(29, 48, 43, .64); font-family: var(--mono); font-size: 8px; letter-spacing: .1em; }
      .stat-value { font-family: Georgia, serif; font-size: 21px; font-variant-numeric: tabular-nums; }
      .stat-divider { width: 1px; height: 31px; background: rgba(29, 48, 43, .2); }

      .icon-button {
        display: grid;
        width: 39px;
        height: 39px;
        place-items: center;
        border: 1px solid rgba(29, 48, 43, .28);
        border-radius: 50%;
        background: rgba(249, 248, 238, .3);
        cursor: pointer;
        pointer-events: auto;
        transition: background .15s ease, transform .15s ease;
      }
      .icon-button:hover { background: rgba(249, 248, 238, .75); transform: translateY(-1px); }
      .icon-button svg { width: 16px; height: 16px; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }

      .center-overlay {
        position: absolute;
        z-index: 2;
        top: 47%;
        left: 50%;
        width: min(90vw, 540px);
        padding: 18px;
        text-align: center;
        transform: translate(-50%, -50%);
        transition: opacity .2s ease, visibility .2s ease;
      }
      .center-overlay[hidden] { display: block; visibility: hidden; opacity: 0; pointer-events: none; }
      .overline { margin: 0 0 13px; color: rgba(29, 48, 43, .75); font-family: var(--mono); font-size: 9px; letter-spacing: .2em; }
      .game-title { margin: 0; font-family: Georgia, 'Times New Roman', serif; font-size: clamp(48px, 9vw, 102px); font-weight: 400; line-height: .9; letter-spacing: -.04em; }
      .game-title em { color: var(--coral); font-weight: 400; }
      .overlay-copy { min-height: 18px; margin: 16px 0 22px; color: rgba(29, 48, 43, .75); font-size: 12px; }

      .ride-button {
        display: inline-flex;
        min-width: 151px;
        height: 48px;
        align-items: center;
        justify-content: center;
        gap: 10px;
        padding: 0 18px;
        border: 0;
        border-radius: 2px;
        background: var(--ink);
        color: var(--paper);
        cursor: pointer;
        font-size: 11px;
        font-weight: 700;
        letter-spacing: .09em;
        text-transform: uppercase;
        transition: background .16s ease, transform .16s ease;
      }
      .ride-button:hover { background: #36534a; transform: translateY(-2px); }
      .ride-button svg { width: 15px; height: 15px; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }

      .jump-button {
        position: absolute;
        z-index: 2;
        right: max(26px, env(safe-area-inset-right));
        bottom: max(29px, env(safe-area-inset-bottom));
        display: inline-flex;
        min-width: 91px;
        height: 48px;
        align-items: center;
        justify-content: center;
        gap: 8px;
        padding: 0 15px;
        border: 1px solid rgba(29, 48, 43, .55);
        border-radius: 2px;
        background: rgba(249, 248, 238, .72);
        color: var(--ink);
        cursor: pointer;
        font-size: 10px;
        font-weight: 700;
        letter-spacing: .08em;
        opacity: .45;
        transition: opacity .15s ease, background .15s ease, transform .15s ease;
        touch-action: manipulation;
      }
      .jump-button:enabled { opacity: 1; }
      .jump-button:enabled:hover { background: var(--paper); transform: translateY(-2px); }
      .jump-button svg { width: 17px; height: 17px; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }

      .bottom-note {
        position: absolute;
        z-index: 2;
        bottom: max(42px, env(safe-area-inset-bottom));
        left: clamp(20px, 5vw, 72px);
        color: rgba(29, 48, 43, .67);
        font-family: var(--mono);
        font-size: 8px;
        letter-spacing: .1em;
        pointer-events: none;
      }
      .bottom-note span { margin: 0 8px; color: var(--coral); }

      @media (max-width: 600px) {
        .masthead { align-items: flex-start; padding-top: max(17px, env(safe-area-inset-top)); }
        .brand-mark { width: 31px; height: 31px; font-size: 18px; }
        .brand-name strong { font-size: 9px; }
        .brand-name small { font-size: 7px; }
        .ride-stats { gap: 10px; }
        .stat { min-width: 43px; gap: 3px; }
        .stat-label { font-size: 7px; }
        .stat-value { font-size: 17px; }
        .stat-divider { height: 26px; }
        .icon-button { width: 34px; height: 34px; }
        .center-overlay { top: 44%; }
        .game-title { font-size: clamp(49px, 14vw, 72px); }
        .bottom-note { bottom: max(36px, env(safe-area-inset-bottom)); font-size: 7px; }
        .jump-button { right: max(18px, env(safe-area-inset-right)); bottom: max(20px, env(safe-area-inset-bottom)); }
      }

      @media (max-height: 520px) and (min-width: 601px) {
        .center-overlay { top: 51%; }
        .game-title { font-size: 60px; }
        .overlay-copy { margin: 9px 0 13px; }
      }

      @media (prefers-reduced-motion: reduce) {
        *, *::before, *::after { transition-duration: .01ms !important; }
      }
    </style>
  </head>
  <body>
    <main class="game" aria-label="Open Road bicycle game">
      <canvas id="ride-canvas" aria-label="A cyclist rides along a rolling country road. Avoid obstacles by jumping." role="img"></canvas>

      <header class="masthead">
        <div class="brand" aria-label="Open Road">
          <span class="brand-mark" aria-hidden="true">r</span>
          <span class="brand-name"><strong>OPEN ROAD</strong><small>A LITTLE ROOM TO ROAM</small></span>
        </div>
        <div class="ride-stats" aria-label="Ride statistics">
          <div class="stat"><span class="stat-label">DISTANCE</span><span class="stat-value" id="distance">0000<span style="font-size:11px"> m</span></span></div>
          <span class="stat-divider" aria-hidden="true"></span>
          <div class="stat"><span class="stat-label">PERSONAL BEST</span><span class="stat-value" id="best">0000<span style="font-size:11px"> m</span></span></div>
          <button class="icon-button" id="pause-button" type="button" aria-label="Pause ride" title="Pause ride" disabled>
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 5v14M15 5v14" /></svg>
          </button>
        </div>
      </header>

      <section class="center-overlay" id="center-overlay" aria-live="polite">
        <p class="overline" id="overlay-overline">A RIDE THROUGH THE QUIET</p>
        <h1 class="game-title" id="overlay-title">Open <em>road.</em></h1>
        <p class="overlay-copy" id="overlay-copy">The long way is the good way.</p>
        <button class="ride-button" id="ride-button" type="button">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="m8 5 11 7-11 7V5Z" /></svg>
          <span id="ride-button-label">Start riding</span>
        </button>
      </section>

      <p class="bottom-note">A SMALL ARCADE GAME <span>·</span> TAKE IT AT YOUR OWN PACE</p>

      <button class="jump-button" id="jump-button" type="button" disabled aria-label="Jump over an obstacle">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 19V5m-6 6 6-6 6 6" /></svg>
        JUMP
      </button>
    </main>

    <script>
      const canvas = document.querySelector('#ride-canvas');
      const ctx = canvas.getContext('2d');
      const distanceLabel = document.querySelector('#distance');
      const bestLabel = document.querySelector('#best');
      const overlay = document.querySelector('#center-overlay');
      const overlayOverline = document.querySelector('#overlay-overline');
      const overlayTitle = document.querySelector('#overlay-title');
      const overlayCopy = document.querySelector('#overlay-copy');
      const rideButton = document.querySelector('#ride-button');
      const rideButtonLabel = document.querySelector('#ride-button-label');
      const pauseButton = document.querySelector('#pause-button');
      const jumpButton = document.querySelector('#jump-button');

      const palette = {
        sky: '#c7e7de',
        cloud: '#f9f5e8',
        farHill: '#a4c9a1',
        midHill: '#75a47a',
        nearHill: '#5d8561',
        grass: '#cbe27a',
        grassLight: '#dceda2',
        road: '#3c5047',
        roadLight: '#50685a',
        ink: '#1d302b',
        coral: '#df684b',
        wheel: '#263b34',
        frame: '#e75e42',
        rider: '#f1c74c',
      };

      let width = 0;
      let height = 0;
      let pixelRatio = 1;
      let state = 'ready';
      let lastFrame = 0;
      let elapsed = 0;
      let worldDistance = 0;
      let bestDistance = 0;
      let speed = 285;
      let jumpHeight = 0;
      let jumpVelocity = 0;
      let wheelRotation = 0;
      let obstacleDistance = 0;
      let sceneryOffset = 0;
      let animationId = 0;
      let obstacles = [];

      try {
        bestDistance = Number(localStorage.getItem('open-road-best')) || 0;
      } catch {
        bestDistance = 0;
      }

      function setDistanceLabel(element, value) {
        element.firstChild.textContent = String(Math.floor(value)).padStart(4, '0');
      }

      function resizeCanvas() {
        const bounds = canvas.getBoundingClientRect();
        width = bounds.width;
        height = bounds.height;
        pixelRatio = Math.min(window.devicePixelRatio || 1, 2);
        canvas.width = Math.round(width * pixelRatio);
        canvas.height = Math.round(height * pixelRatio);
        ctx.setTransform(pixelRatio, 0, 0, pixelRatio, 0, 0);
        drawScene(0);
      }

      function hillPath(base, amplitude, phase, step) {
        ctx.beginPath();
        ctx.moveTo(0, height);
        ctx.lineTo(0, base + Math.sin(phase) * amplitude);
        for (let x = 0; x <= width + step; x += step) {
          const y = base + Math.sin(x * .004 + phase) * amplitude + Math.sin(x * .009 + phase * 1.6) * amplitude * .28;
          ctx.lineTo(x, y);
        }
        ctx.lineTo(width, height);
        ctx.closePath();
        ctx.fill();
      }

      function drawCloud(x, y, scale) {
        ctx.fillStyle = palette.cloud;
        ctx.beginPath();
        ctx.moveTo(x, y + 13 * scale);
        ctx.bezierCurveTo(x + 1 * scale, y + 4 * scale, x + 10 * scale, y + 2 * scale, x + 17 * scale, y + 7 * scale);
        ctx.bezierCurveTo(x + 22 * scale, y - 4 * scale, x + 38 * scale, y - 4 * scale, x + 44 * scale, y + 7 * scale);
        ctx.bezierCurveTo(x + 57 * scale, y + 4 * scale, x + 65 * scale, y + 11 * scale, x + 63 * scale, y + 17 * scale);
        ctx.lineTo(x + 2 * scale, y + 17 * scale);
        ctx.closePath();
        ctx.fill();
      }

      function drawTree(x, ground, scale, tint) {
        ctx.save();
        ctx.translate(x, ground);
        ctx.scale(scale, scale);
        ctx.fillStyle = '#66594a';
        ctx.fillRect(-3, -39, 6, 41);
        ctx.fillStyle = tint;
        ctx.beginPath();
        ctx.moveTo(0, -76);
        ctx.lineTo(23, -36);
        ctx.lineTo(13, -36);
        ctx.lineTo(31, -15);
        ctx.lineTo(-30, -15);
        ctx.lineTo(-12, -37);
        ctx.lineTo(-23, -37);
        ctx.closePath();
        ctx.fill();
        ctx.restore();
      }

      function drawBackground(time) {
        const sky = ctx.createLinearGradient(0, 0, 0, height);
        sky.addColorStop(0, '#bce3df');
        sky.addColorStop(.58, '#e8edc9');
        sky.addColorStop(1, '#d7e9a1');
        ctx.fillStyle = sky;
        ctx.fillRect(0, 0, width, height);

        const cloudDrift = (time * 5) % (width + 240);
        drawCloud(width * .17 - cloudDrift * .18, height * .2, .8);
        drawCloud(width * .72 - cloudDrift * .11, height * .13, .62);

        ctx.fillStyle = palette.farHill;
        hillPath(height * .57, height * .06, 1.1 + time * .00003, 28);
        ctx.fillStyle = palette.midHill;
        hillPath(height * .64, height * .055, 3 + time * .00005, 24);

        const horizon = height * .72;
        ctx.fillStyle = palette.nearHill;
        ctx.fillRect(0, horizon, width, height - horizon);
        const treeSpacing = 112;
        const treeShift = (time * speed * .36) % treeSpacing;
        for (let x = -treeSpacing - treeShift; x < width + treeSpacing; x += treeSpacing) {
          const offset = Math.sin((x + treeShift) * .03) * 13;
          drawTree(x, horizon + 17 + offset, .55 + ((x / treeSpacing) % 2) * .14, x % 3 === 0 ? '#527752' : '#678858');
        }

        ctx.fillStyle = palette.grass;
        ctx.beginPath();
        ctx.moveTo(0, height * .76);
        ctx.quadraticCurveTo(width * .47, height * .69, width, height * .75);
        ctx.lineTo(width, height);
        ctx.lineTo(0, height);
        ctx.closePath();
        ctx.fill();

        const dashY = height * .85;
        const dashShift = (time * speed * .72) % 58;
        for (let x = -58 - dashShift; x < width + 58; x += 58) {
          ctx.fillStyle = '#e4e8b8';
          ctx.fillRect(x, dashY, 25, 3);
        }

        ctx.strokeStyle = 'rgba(62, 92, 52, .35)';
        ctx.lineWidth = 2;
        const tuftOffset = (time * speed * .85) % 85;
        for (let x = -85 - tuftOffset; x < width + 85; x += 85) {
          ctx.beginPath();
          ctx.moveTo(x, height * .795);
          ctx.lineTo(x + 3, height * .77);
          ctx.moveTo(x + 4, height * .795);
          ctx.lineTo(x + 10, height * .775);
          ctx.stroke();
        }
      }

      function groundLine() {
        return height * .77;
      }

      function drawWheel(x, y, radius, rotation) {
        ctx.save();
        ctx.translate(x, y);
        ctx.rotate(rotation);
        ctx.strokeStyle = palette.wheel;
        ctx.lineWidth = Math.max(3, radius * .1);
        ctx.beginPath();
        ctx.arc(0, 0, radius, 0, Math.PI * 2);
        ctx.stroke();
        ctx.strokeStyle = 'rgba(29, 48, 43, .4)';
        ctx.lineWidth = 1;
        for (let spoke = 0; spoke < 8; spoke += 1) {
          const angle = spoke * Math.PI / 4;
          ctx.beginPath();
          ctx.moveTo(0, 0);
          ctx.lineTo(Math.cos(angle) * radius * .86, Math.sin(angle) * radius * .86);
          ctx.stroke();
        }
        ctx.fillStyle = palette.coral;
        ctx.beginPath();
        ctx.arc(0, 0, Math.max(3, radius * .09), 0, Math.PI * 2);
        ctx.fill();
        ctx.restore();
      }

      function drawBike(time) {
        const ground = groundLine();
        const wheelRadius = Math.max(21, Math.min(32, height * .047));
        const bikeScale = wheelRadius / 27;
        const rearX = width * .23;
        const frontX = rearX + wheelRadius * 2.14;
        const wheelY = ground - wheelRadius - jumpHeight;
        const pedal = state === 'running' ? Math.sin(time * .014) * .17 : 0;

        ctx.save();
        ctx.translate(0, Math.sin(time * .025) * 1.3 - jumpHeight);

        drawWheel(rearX, ground - wheelRadius, wheelRadius, wheelRotation);
        drawWheel(frontX, ground - wheelRadius, wheelRadius, wheelRotation);

        const crankX = rearX + wheelRadius * .98;
        const crankY = ground - wheelRadius * .91;
        const seatX = rearX + wheelRadius * .77;
        const seatY = ground - wheelRadius * 2.02;
        const headX = frontX - wheelRadius * .74;
        const headY = ground - wheelRadius * 2.52;
        const handleX = frontX - wheelRadius * .08;
        const handleY = ground - wheelRadius * 2.02;

        ctx.strokeStyle = palette.frame;
        ctx.lineWidth = 5 * bikeScale;
        ctx.lineCap = 'round';
        ctx.lineJoin = 'round';
        ctx.beginPath();
        ctx.moveTo(rearX, ground - wheelRadius);
        ctx.lineTo(seatX, seatY);
        ctx.lineTo(crankX, crankY);
        ctx.lineTo(rearX, ground - wheelRadius);
        ctx.moveTo(crankX, crankY);
        ctx.lineTo(frontX, ground - wheelRadius);
        ctx.lineTo(handleX, handleY);
        ctx.lineTo(headX, headY + wheelRadius * .33);
        ctx.moveTo(seatX, seatY);
        ctx.lineTo(frontX, ground - wheelRadius);
        ctx.stroke();

        ctx.strokeStyle = palette.ink;
        ctx.lineWidth = 3 * bikeScale;
        ctx.beginPath();
        ctx.moveTo(seatX - wheelRadius * .29, seatY);
        ctx.lineTo(seatX + wheelRadius * .35, seatY);
        ctx.moveTo(handleX - wheelRadius * .18, handleY - wheelRadius * .07);
        ctx.lineTo(handleX + wheelRadius * .25, handleY - wheelRadius * .07);
        ctx.stroke();

        ctx.strokeStyle = palette.ink;
        ctx.lineWidth = 4 * bikeScale;
        ctx.beginPath();
        ctx.moveTo(headX, headY + wheelRadius * .5);
        ctx.lineTo(seatX - wheelRadius * .03, seatY - wheelRadius * .1);
        ctx.lineTo(crankX + wheelRadius * .16, crankY - wheelRadius * .09);
        ctx.stroke();

        ctx.fillStyle = palette.rider;
        ctx.beginPath();
        ctx.arc(headX, headY, wheelRadius * .32, 0, Math.PI * 2);
        ctx.fill();
        ctx.fillStyle = palette.coral;
        ctx.beginPath();
        ctx.arc(headX + wheelRadius * .02, headY - wheelRadius * .09, wheelRadius * .34, Math.PI, Math.PI * 2);
        ctx.lineTo(headX + wheelRadius * .39, headY - wheelRadius * .03);
        ctx.lineTo(headX - wheelRadius * .15, headY - wheelRadius * .03);
        ctx.closePath();
        ctx.fill();

        ctx.strokeStyle = palette.rider;
        ctx.lineWidth = 7 * bikeScale;
        ctx.lineCap = 'round';
        ctx.beginPath();
        ctx.moveTo(headX + wheelRadius * .06, headY + wheelRadius * .43);
        ctx.lineTo(seatX + wheelRadius * .25, seatY - wheelRadius * .16);
        ctx.lineTo(handleX - wheelRadius * .05, handleY + wheelRadius * .08);
        ctx.moveTo(seatX + wheelRadius * .25, seatY - wheelRadius * .16);
        ctx.lineTo(seatX + wheelRadius * .43 + pedal * wheelRadius, crankY - wheelRadius * .23);
        ctx.lineTo(crankX + wheelRadius * .18, crankY + wheelRadius * .06);
        ctx.moveTo(seatX + wheelRadius * .25, seatY - wheelRadius * .16);
        ctx.lineTo(seatX - wheelRadius * .02 - pedal * wheelRadius, crankY - wheelRadius * .28);
        ctx.lineTo(crankX - wheelRadius * .2, crankY + wheelRadius * .12);
        ctx.stroke();

        ctx.restore();

        if (jumpHeight > 0) {
          ctx.fillStyle = `rgba(48, 67, 48, ${Math.max(.08, .2 - jumpHeight / 900)})`;
          ctx.beginPath();
          ctx.ellipse((rearX + frontX) / 2, ground + 3, wheelRadius * 2.2, 5, 0, 0, Math.PI * 2);
          ctx.fill();
        }

        return { rearX, frontX, wheelRadius, wheelY };
      }

      function drawObstacle(obstacle) {
        const y = groundLine();
        ctx.save();
        ctx.translate(obstacle.x, y);
        if (obstacle.kind === 'log') {
          ctx.fillStyle = '#865841';
          ctx.beginPath();
          ctx.roundRect(-obstacle.width / 2, -obstacle.height, obstacle.width, obstacle.height, obstacle.height / 2);
          ctx.fill();
          ctx.strokeStyle = '#b7865c';
          ctx.lineWidth = 2;
          ctx.beginPath();
          ctx.ellipse(-obstacle.width / 2 + 6, -obstacle.height / 2, 4, obstacle.height / 2 - 1, 0, 0, Math.PI * 2);
          ctx.stroke();
          ctx.strokeStyle = 'rgba(55, 43, 35, .5)';
          ctx.beginPath();
          ctx.moveTo(-obstacle.width * .14, -obstacle.height + 3);
          ctx.lineTo(obstacle.width * .05, -3);
          ctx.moveTo(obstacle.width * .28, -obstacle.height + 4);
          ctx.lineTo(obstacle.width * .1, -3);
          ctx.stroke();
        } else if (obstacle.kind === 'rock') {
          ctx.fillStyle = '#ab7454';
          ctx.beginPath();
          ctx.moveTo(-obstacle.width / 2, 0);
          ctx.lineTo(-obstacle.width * .43, -obstacle.height * .45);
          ctx.lineTo(-obstacle.width * .08, -obstacle.height);
          ctx.lineTo(obstacle.width * .32, -obstacle.height * .83);
          ctx.lineTo(obstacle.width / 2, 0);
          ctx.closePath();
          ctx.fill();
          ctx.fillStyle = 'rgba(237, 191, 136, .6)';
          ctx.beginPath();
          ctx.moveTo(-obstacle.width * .2, -obstacle.height * .68);
          ctx.lineTo(-obstacle.width * .08, -obstacle.height);
          ctx.lineTo(obstacle.width * .15, -obstacle.height * .77);
          ctx.closePath();
          ctx.fill();
        } else {
          ctx.fillStyle = '#eee7c9';
          ctx.beginPath();
          ctx.ellipse(0, -3, obstacle.width / 2, 7, 0, 0, Math.PI * 2);
          ctx.fill();
          ctx.strokeStyle = 'rgba(61, 79, 64, .45)';
          ctx.lineWidth = 1;
          ctx.beginPath();
          ctx.ellipse(0, -3, obstacle.width * .32, 3, 0, 0, Math.PI * 2);
          ctx.stroke();
        }
        ctx.restore();
      }

      function drawScene(time) {
        if (!ctx || width === 0 || height === 0) return;
        ctx.clearRect(0, 0, width, height);
        drawBackground(time);
        for (const obstacle of obstacles) drawObstacle(obstacle);
        drawBike(time);
      }

      function update(delta) {
        if (state !== 'running') return;
        elapsed += delta;
        speed = Math.min(285 + worldDistance * .018, 570);
        worldDistance += speed * delta / 10;
        sceneryOffset += speed * delta;
        wheelRotation += speed * delta / 27;

        if (jumpHeight > 0 || jumpVelocity > 0) {
          jumpHeight += jumpVelocity * delta;
          jumpVelocity -= 1570 * delta;
          if (jumpHeight <= 0) {
            jumpHeight = 0;
            jumpVelocity = 0;
          }
        }

        obstacleDistance -= speed * delta;
        if (obstacleDistance <= 0) {
          const kinds = ['log', 'rock', 'puddle'];
          const kind = kinds[Math.floor(Math.random() * kinds.length)];
          const scale = Math.max(.83, Math.min(1.3, height / 700));
          const obstacle = {
            kind,
            x: width + 45,
            width: (kind === 'log' ? 46 : kind === 'rock' ? 39 : 50) * scale,
            height: (kind === 'log' ? 24 : kind === 'rock' ? 27 : 8) * scale,
          };
          obstacles.push(obstacle);
          obstacleDistance = 350 + Math.random() * 180;
        }

        for (const obstacle of obstacles) obstacle.x -= speed * delta;
        obstacles = obstacles.filter((obstacle) => obstacle.x + obstacle.width / 2 > -10);

        const bikeFront = width * .23 + Math.max(21, Math.min(32, height * .047)) * 2.14;
        const bikeBack = width * .23;
        for (const obstacle of obstacles) {
          const overlapsBike = obstacle.x - obstacle.width / 2 < bikeFront - 2 && obstacle.x + obstacle.width / 2 > bikeBack + 3;
          if (overlapsBike && jumpHeight < obstacle.height + 12) {
            endRide();
            break;
          }
        }

        setDistanceLabel(distanceLabel, worldDistance);
      }

      function frame(timestamp) {
        const delta = lastFrame ? Math.min((timestamp - lastFrame) / 1000, .04) : 0;
        lastFrame = timestamp;
        update(delta);
        drawScene(timestamp);
        animationId = window.requestAnimationFrame(frame);
      }

      function setOverlay(mode) {
        overlay.hidden = mode === 'running';
        if (mode === 'ready') {
          overlayOverline.textContent = 'A RIDE THROUGH THE QUIET';
          overlayTitle.innerHTML = 'Open <em>road.</em>';
          overlayCopy.textContent = 'The long way is the good way.';
          rideButtonLabel.textContent = 'Start riding';
        } else if (mode === 'paused') {
          overlayOverline.textContent = 'CATCH YOUR BREATH';
          overlayTitle.textContent = 'Take a pause.';
          overlayCopy.textContent = `${Math.floor(worldDistance)} metres behind you.`;
          rideButtonLabel.textContent = 'Keep riding';
        } else if (mode === 'over') {
          overlayOverline.textContent = 'THAT WAS A GOOD RIDE';
          overlayTitle.textContent = 'Ride ended.';
          overlayCopy.textContent = `${Math.floor(worldDistance)} metres. Your best is ${Math.floor(bestDistance)} metres.`;
          rideButtonLabel.textContent = 'Ride again';
        }
      }

      function startRide() {
        if (state === 'paused') {
          state = 'running';
          lastFrame = performance.now();
          setOverlay(state);
          pauseButton.disabled = false;
          jumpButton.disabled = false;
          return;
        }
        elapsed = 0;
        worldDistance = 0;
        speed = 285;
        jumpHeight = 0;
        jumpVelocity = 0;
        obstacles = [];
        obstacleDistance = 500;
        state = 'running';
        lastFrame = performance.now();
        setDistanceLabel(distanceLabel, 0);
        setOverlay(state);
        pauseButton.disabled = false;
        jumpButton.disabled = false;
        drawScene(lastFrame);
      }

      function pauseRide() {
        if (state !== 'running') return;
        state = 'paused';
        setOverlay(state);
        pauseButton.disabled = true;
        jumpButton.disabled = true;
      }

      function endRide() {
        if (state !== 'running') return;
        state = 'over';
        bestDistance = Math.max(bestDistance, worldDistance);
        setDistanceLabel(bestLabel, bestDistance);
        try {
          localStorage.setItem('open-road-best', String(Math.floor(bestDistance)));
        } catch {
          // The ride still works when storage is unavailable.
        }
        setOverlay(state);
        pauseButton.disabled = true;
        jumpButton.disabled = true;
      }

      function jump() {
        if (state !== 'running' || jumpHeight > 0) return;
        jumpVelocity = Math.max(570, height * .78);
      }

      rideButton.addEventListener('click', startRide);
      jumpButton.addEventListener('click', jump);
      pauseButton.addEventListener('click', pauseRide);

      window.addEventListener('keydown', (event) => {
        if (event.code === 'Space' || event.code === 'ArrowUp' || event.code === 'KeyW') {
          event.preventDefault();
          if (state === 'ready' || state === 'over') startRide();
          else jump();
        } else if (event.code === 'Escape' || event.code === 'KeyP') {
          if (state === 'running') pauseRide();
          else if (state === 'paused') startRide();
        }
      });

      setDistanceLabel(bestLabel, bestDistance);
      resizeCanvas();
      animationId = window.requestAnimationFrame(frame);
      window.addEventListener('resize', resizeCanvas, { passive: true });
    </script>
  </body>
</html>
